server:
  address: 127.0.0.1
spring:
  datasource:
    url: jdbc:h2:mem:submate_demo;MODE=MySQL;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  sql:
    init:
      mode: always
      schema-locations: classpath:db/demo-catalog.sql,classpath:db/subscription-schema.sql,classpath:db/migrations/20261109-tracked-subscriptions.sql
      data-locations: classpath:db/demo-data.sql
